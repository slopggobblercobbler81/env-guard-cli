name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov PyYAML

      - name: Run test suite with coverage
        run: |
          pytest --cov=env_guard --cov-report=xml --cov-report=term

      - name: Test CLI execution
        run: |
          python -m env_guard --version
          python -m env_guard validate --help
          python -m env_guard audit --help
          python -m env_guard generate --help
          python -m env_guard infer --help
          python -m env_guard diff --help
          python -m env_guard redact --help
